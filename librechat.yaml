# LibreChat Configuration
# https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.13

cache: true

memory:
  disabled: false
  personalize: true
  validKeys:
    - preferences
    - work_info
    - personal_info
    - skills
    - interests
    - context
  tokenLimit: 10000
  maxInputTokens: 12000
  agent:
    enabled: true
    provider: openrouter
    model: openai/gpt-5.6-luna-pro
    instructions: |
      You are a memory management assistant. Extract and store important user information accurately. Focus on preferences, personal details, work context, skills, and interests. Be concise and precise with stored values.
    model_parameters:
      temperature: 0.1

endpoints:
  custom:
    - name: openrouter
      apiKey: '${OPENROUTER_KEY}'
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - openai/gpt-5.6-luna-pro
          - x-ai/grok-4.5
          - anthropic/claude-sonnet-5
          - meta-llama/llama-3-70b-instruct
        fetch: true
      titleConvo: true
      titleModel: openai/gpt-5.6-luna-pro
      dropParams:
        - stop
      modelDisplayLabel: OpenRouter

mcpServers:
  browserbase:
    type: streamable-http
    url: 'https://mcp.browserbase.com/mcp?browserbaseApiKey=${BROWSERBASE_API_KEY}&browserbaseProjectId=8309ee7c-d2f5-4f6c-b196-e32f1064316a'
  gems:
    url: https://gems.beenex.cloud/sse
    timeout: 30000
  ms365:
    type: streamable-http
    url: https://ms365.beenex.cloud/mcp
    timeout: 60000

# Model Specs with conversation starters for the Bankie v2 agent
modelSpecs:
  list:
    - name: 'bankie-v2'
      label: 'Bankie v2'
      description: 'Grant workflow assistant for Palm Beach County Food Bank'
      default: true
      conversation_starters:
        - 'Start the Coastal Harvest senior food box application. What do we know and what''s due?'
        - 'Draft the application and tell me what''s missing.'
        - 'Send the missing items to Yanet and the review to Jamie.'
        - 'Did anyone respond? Update the tracker.'
        - 'Check for new awards this week and notify the team.'
        - 'Give me the grant pipeline for the next 30 days.'
      preset:
        endpoint: 'agents'
        agent_id: 'agent_Pk03jsH4evZ40HMloZqYe'
